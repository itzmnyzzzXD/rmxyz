name: Fix bot startup conflict

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch duplicate command registration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bot/bot.py")
          text = path.read_text(encoding="utf-8")
          original = text

          # discord.py's cog override does not resolve an alias collision
          # between two different cogs. The Info cog owns `dashboard`, so the
          # verification cog must not also claim that alias.
          text = text.replace(
              '@commands.command(name="verify", aliases=["verifyaccount", "dashboard", "panel"])',
              '@commands.command(name="verify", aliases=["verifyaccount", "panel"])',
          )

          # Keep the VPS pointed at the deployed Vercel dashboard by default.
          text = text.replace(
              'DASHBOARD_URL = os.getenv("DASHBOARD_URL", "https://rmxyz.lovable.app").rstrip("/")',
              'DASHBOARD_URL = os.getenv("DASHBOARD_URL", "https://rmxyz.vercel.app").rstrip("/")',
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Patched bot.py successfully.")
          else:
              print("No bot.py patch needed.")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/bot.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix duplicate dashboard command alias"
            git push
          fi