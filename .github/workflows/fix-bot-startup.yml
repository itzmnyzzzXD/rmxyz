name: Fix bot startup conflict

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch duplicate command registration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/bot.py")
          text = path.read_text(encoding="utf-8")
          old = "await bot.add_cog(cog)"
          new = "await bot.add_cog(cog, override=True)"

          if old in text and new not in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
              print("Patched bot.py: enabled cog command override.")
          else:
              print("No bot.py patch needed.")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/bot.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix bot duplicate command registration"
            git push
          fi
