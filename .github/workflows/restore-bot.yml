name: Restore bot.py

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore bot.py from known-good commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore bot.py
        run: |
          git checkout 50462518c1ee97db687e92562641a02413c402d1 -- bot/bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/bot.py
          git commit -m 'Restore bot.py from known-good commit'
          git push
